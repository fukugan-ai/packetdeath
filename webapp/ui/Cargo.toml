[package]
name = "packetdeath-ui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The screens of the packetdeath console: one Dioxus island compiled to WebAssembly."

# Its own lock file and target directory, like `webapp/`: the screens compile to
# wasm32 and must not share a build with the server.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["web", "lib"] }
dioxus-web = "=0.7.10"
gloo-net = "=0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same version as the `wasm-bindgen` command that turns the wasm into a js module.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
# The browser's passkey API takes and gives buffers: js-sys reaches them, data-encoding turns them to and from base64url text.
js-sys = "=0.3.106"
data-encoding = "2"
web-sys = { version = "=0.3.106", features = ["Document", "Element", "HtmlElement", "RequestCredentials", "Window", "Storage", "Location", "Navigator", "console"] }

[lints.rust]
unsafe_code = "forbid"
