[package]
name = "packetdeath-webapp"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The browser console of packetdeath: sign-in, users, and the settings of the IPS, IDS, WAF and antivirus parts."

# Its own lock file and target directory: the console needs a web server and a
# password hash that the packet tool itself must not carry.
[workspace]

[dependencies]
# The packet tool as a library: the console checks every file it writes with
# the same parsers the tool reads it with.
packetdeath = { path = ".." }
axum = { version = "0.8.9", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Argon2id for passwords; the salt comes from the OS through getrandom.
argon2 = { version = "0.6.0", features = ["getrandom"] }
getrandom = "0.4"
sha2 = "0.11"
# Time-based one-time passwords (RFC 6238): HMAC-SHA1, base32 secrets, constant-time compare.
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
subtle = "2"
# WebAuthn: ES256 signature verification only (P-256, SHA-256).
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"
